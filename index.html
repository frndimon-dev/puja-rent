<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD Captain | Durga Puja 2026 Fleet & Revenue Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Credentials
    const SUPABASE_URL = "https://ntlbyqhmhdryqdyxaevk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HRMQgDnzbWgKC2ocml3T5A_DrMQhE3Q";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 5-Color Repeating Palette for 11 Puja Days
    const PUJA_SCHEDULE = [
      { date: "2026-10-10", label: "Mahalaya", colorClass: "text-indigo-600 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-11", label: "Pratipada", colorClass: "text-emerald-600 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-12", label: "Dwitiya", colorClass: "text-amber-600 bg-amber-50 border-amber-200" },
      { date: "2026-10-13", label: "Tritiya", colorClass: "text-purple-600 bg-purple-50 border-purple-200" },
      { date: "2026-10-14", label: "Chaturthi", colorClass: "text-teal-600 bg-teal-50 border-teal-200" },
      { date: "2026-10-15", label: "Panchami", colorClass: "text-indigo-600 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-16", label: "Maha Sasthi", colorClass: "text-emerald-600 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-17", label: "Maha Saptami", colorClass: "text-amber-600 bg-amber-50 border-amber-200" },
      { date: "2026-10-18", label: "Maha Asthami", colorClass: "text-purple-600 bg-purple-50 border-purple-200" },
      { date: "2026-10-19", label: "Maha Navami", colorClass: "text-teal-600 bg-teal-50 border-teal-200" },
      { date: "2026-10-20", label: "Vijaya Dashami", colorClass: "text-indigo-600 bg-indigo-50 border-indigo-200" },
    ];

    // Language Dictionary (English & Hindi)
    const DICTIONARY = {
      en: {
        subtitle: "Durga Puja 2026 Fleet & Revenue Tracker (Kolkata / Delhi)",
        tabTimeline: "Booking Timeline",
        tabCustomers: "Customer Database",
        totalRevenue: "Total Revenue (Booked)",
        totalCollected: "Total Collected (Advance)",
        totalDue: "Total Due (Pending)",
        fleetStrength: "Fleet Status",
        petrolGrid: "Petrol Scooty Dashboard",
        evGrid: "EV Scooty Dashboard",
        addPetrol: "Add Petrol Vehicle",
        addEv: "Add EV Vehicle",
        garage: "Garage / Maintenance",
        active: "Active",
        available: "Available",
        booked: "Booked",
        inGarage: "In Garage",
        rentPerDay: "Rent/Day",
        vehicle: "Vehicle / Model",
        action: "Action"
      },
      hi: {
        subtitle: "दुर्गा पूजा 2026 फ्लीट और रेवेन्यू ट्रैकर (कोलकाता / दिल्ली)",
        tabTimeline: "बुकिंग टाइमलाइन",
        tabCustomers: "कस्टमर डेटाबेस",
        totalRevenue: "कुल रेवेन्यू (बुकिंग मूल्य)",
        totalCollected: "कुल जमा (एडवांस मिला)",
        totalDue: "कुल बाकी (डिलीवरी पर)",
        fleetStrength: "गाड़ी स्थिति",
        petrolGrid: "पेट्रोल स्कूटी डैशबोर्ड",
        evGrid: "ईवी स्कूटी डैशबोर्ड",
        addPetrol: "पेट्रोल गाड़ी जोड़ें",
        addEv: "ईवी गाड़ी जोड़ें",
        garage: "गैराज / मेंटेनेंस",
        active: "चालू है",
        available: "खाली है",
        booked: "बुक है",
        inGarage: "गैराज में है",
        rentPerDay: "किराया/दिन",
        vehicle: "गाड़ी / मॉडल",
        action: "कार्रवाई"
      }
    };

    function App() {
      const [lang, setLang] = useState('en');
      const t = DICTIONARY[lang];

      const [vehicles, setVehicles] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('timeline');

      // Modals
      const [showAddVehicleModal, setShowAddVehicleModal] = useState(false);
      const [vehicleTypeToAdd, setVehicleTypeToAdd] = useState('petrol');
      const [showSlotActionModal, setShowSlotActionModal] = useState(false);
      const [selectedSlot, setSelectedSlot] = useState(null); // { vehicle, date }
      const [showBookingModal, setShowBookingModal] = useState(false);
      const [selectedBookingDetail, setSelectedBookingDetail] = useState(null);
      const [showInvoiceModal, setShowInvoiceModal] = useState(null);

      // Forms
      const [newVehicle, setNewVehicle] = useState({ model_name: '', vehicle_type: 'petrol', registration_no: '', daily_rent: '' });
      const [newBooking, setNewBooking] = useState({
        customer_name: '', customer_phone: '', customer_whatsapp: '',
        start_date: '', end_date: '', total_rent: 0, advance_paid: 0, due_amount: 0,
        security_deposit: '', original_id_collected: false
      });
      const [maintenanceRange, setMaintenanceRange] = useState({ start_date: '', end_date: '' });

      // Chart Refs
      const revenueChartRef = useRef(null);
      const fleetChartRef = useRef(null);
      const revenueChartInstance = useRef(null);
      const fleetChartInstance = useRef(null);

      const fetchData = async () => {
        try {
          const { data: vData } = await supabase.from('vehicles').select('*').order('created_at', { ascending: true });
          const { data: bData } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
          setVehicles(vData || []);
          setBookings(bData || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Metrics
      const validBookings = bookings.filter(b => b.booking_status !== 'maintenance');
      const totalRevenue = validBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const totalCollected = validBookings.reduce((acc, b) => acc + (parseFloat(b.advance_paid) || 0), 0);
      const totalDue = Math.max(0, totalRevenue - totalCollected);

      const petrolBookings = validBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'petrol';
      });
      const evBookings = validBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'ev';
      });

      const petrolRevenue = petrolBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const evRevenue = evBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);

      // Render Charts
      useEffect(() => {
        if (loading) return;

        if (revenueChartRef.current) {
          if (revenueChartInstance.current) revenueChartInstance.current.destroy();
          const ctx = revenueChartRef.current.getContext('2d');
          revenueChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: [lang === 'en' ? 'Collected (Advance)' : 'जमा राशि (एडवांस)', lang === 'en' ? 'Due Amount' : 'बाकी रकम'],
              datasets: [{
                data: [totalCollected || 1, totalDue || 0],
                backgroundColor: ['#10B981', '#F43F5E'],
                borderWidth: 2,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
            }
          });
        }

        if (fleetChartRef.current) {
          if (fleetChartInstance.current) fleetChartInstance.current.destroy();
          const ctx = fleetChartRef.current.getContext('2d');
          fleetChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: [lang === 'en' ? 'Petrol Scooty' : 'पेट्रोल स्कूटी', lang === 'en' ? 'EV Scooty' : 'ईवी स्कूटी'],
              datasets: [{
                data: [petrolRevenue || 1, evRevenue || 0],
                backgroundColor: ['#F59E0B', '#06B6D4'],
                borderWidth: 2,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
            }
          });
        }
      }, [bookings, vehicles, loading, activeTab, lang]);

      // Calculations
      const autoCalculateAmounts = (startDate, endDate, advance, dailyRate) => {
        if (!startDate || !endDate || !dailyRate) return;
        const d1 = new Date(startDate);
        const d2 = new Date(endDate);
        const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)));
        const total = diffDays * parseFloat(dailyRate);
        const adv = parseFloat(advance) || 0;
        const due = Math.max(0, total - adv);

        setNewBooking(prev => ({ ...prev, total_rent: total, advance_paid: adv, due_amount: due }));
      };

      const handleAddVehicle = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('vehicles').insert([{
          model_name: newVehicle.model_name,
          vehicle_type: vehicleTypeToAdd,
          registration_no: newVehicle.registration_no,
          daily_rent: parseFloat(newVehicle.daily_rent) || 0,
          is_active: true
        }]);

        if (!error) {
          setShowAddVehicleModal(false);
          setNewVehicle({ model_name: '', vehicle_type: 'petrol', registration_no: '', daily_rent: '' });
          fetchData();
        } else alert('Error adding vehicle: ' + error.message);
      };

      const handleToggleMasterVehicle = async (vehicle) => {
        const nextState = vehicle.is_active === false ? true : false;
        const { error } = await supabase.from('vehicles').update({ is_active: nextState }).eq('id', vehicle.id);
        if (!error) fetchData();
        else alert('Error updating status: ' + error.message);
      };

      const handleDeleteVehicle = async (vehicleId, name) => {
        if (confirm(`Are you sure you want to delete ${name} permanently?`)) {
          const { error } = await supabase.from('vehicles').delete().eq('id', vehicleId);
          if (!error) fetchData();
          else alert('Error: ' + error.message);
        }
      };

      const handleAddBooking = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('bookings').insert([{
          vehicle_id: selectedSlot.vehicle.id,
          customer_name: newBooking.customer_name,
          customer_phone: newBooking.customer_phone,
          customer_whatsapp: newBooking.customer_whatsapp,
          start_date: newBooking.start_date,
          end_date: newBooking.end_date,
          total_rent: parseFloat(newBooking.total_rent) || 0,
          advance_paid: parseFloat(newBooking.advance_paid) || 0,
          security_deposit: parseFloat(newBooking.security_deposit) || 0,
          deposit_adjusted: true,
          original_id_collected: newBooking.original_id_collected,
          booking_status: 'confirmed'
        }]);

        if (!error) {
          setShowBookingModal(false);
          fetchData();
        } else alert('Error saving booking: ' + error.message);
      };

      const handleMarkMaintenance = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('bookings').insert([{
          vehicle_id: selectedSlot.vehicle.id,
          customer_name: 'GARAGE MAINTENANCE',
          customer_phone: 'N/A',
          customer_whatsapp: 'N/A',
          start_date: maintenanceRange.start_date,
          end_date: maintenanceRange.end_date,
          total_rent: 0,
          advance_paid: 0,
          security_deposit: 0,
          booking_status: 'maintenance'
        }]);

        if (!error) {
          setShowSlotActionModal(false);
          fetchData();
        } else alert('Error marking maintenance: ' + error.message);
      };

      const handleCancelMaintenance = async (maintenanceId) => {
        if (confirm('Make this date slot available again?')) {
          const { error } = await supabase.from('bookings').delete().eq('id', maintenanceId);
          if (!error) fetchData();
          else alert('Error: ' + error.message);
        }
      };

      const sendWhatsAppInvoice = (booking, vehicle) => {
        const due = Math.max(0, (booking.total_rent || 0) - (booking.advance_paid || 0));
        const depositText = booking.security_deposit > 0 
          ? `🔒 *Security Deposit:* ₹${booking.security_deposit} (Refundable upon vehicle return)\n` 
          : ``;

        const text = `*KD CAPTAIN - DURGA PUJA 2026 BOOKING CONFIRMATION*\n\n` +
          `👤 *Customer Name:* ${booking.customer_name}\n` +
          `🛵 *Vehicle Model:* ${vehicle ? vehicle.model_name : 'Scooty'} (${vehicle ? vehicle.registration_no || 'Assigned' : ''})\n` +
          `📅 *Dates:* ${booking.start_date} to ${booking.end_date}\n` +
          `💰 *Total Rental Charge:* ₹${booking.total_rent}\n` +
          `💳 *Advance Received:* ₹${booking.advance_paid}\n` +
          `🔴 *Due Balance at Handover:* ₹${due}\n` +
          depositText +
          `🪪 *Mandatory Document:* Original ID Proof must be submitted at pickup.\n\n` +
          `Thank you for choosing KD Captain!`;
        
        const cleanNumber = booking.customer_whatsapp.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber.length === 10 ? '91' + cleanNumber : cleanNumber}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const getBookingForDate = (vehicleId, dateStr) => {
        return bookings.find(b => b.vehicle_id === vehicleId && dateStr >= b.start_date && dateStr <= b.end_date);
      };

      const petrolVehicles = vehicles.filter(v => v.vehicle_type === 'petrol');
      const evVehicles = vehicles.filter(v => v.vehicle_type === 'ev');

      const renderGrid = (list, title, type, badgeColor) => (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
          <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-blue-50/50">
            <div className="flex items-center gap-3">
              <span className={`px-2.5 py-1 text-xs font-semibold rounded-full ${badgeColor}`}>
                {type.toUpperCase()}
              </span>
              <h2 className="text-base font-bold text-slate-800">{title}</h2>
              <span className="text-xs text-slate-500 font-medium">({list.length} Vehicles)</span>
            </div>
            <button
              onClick={() => { setVehicleTypeToAdd(type); setShowAddVehicleModal(true); }}
              className="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition flex items-center gap-1.5"
            >
              <i className="fa-solid fa-plus"></i> {type === 'petrol' ? t.addPetrol : t.addEv}
            </button>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="bg-blue-100/70 text-blue-900 border-b border-blue-200 font-bold uppercase">
                  <th className="p-3 sticky left-0 bg-blue-100 z-10 w-48 shadow-sm">{t.vehicle}</th>
                  <th className="p-3 w-20">{t.rentPerDay}</th>
                  {PUJA_SCHEDULE.map(item => (
                    <th key={item.date} className="p-2 text-center min-w-[85px] border-l border-blue-200">
                      <div className={`text-[10px] py-0.5 px-1 rounded border font-black tracking-tight mb-0.5 ${item.colorClass}`}>
                        {item.label}
                      </div>
                      <div className="text-[11px] font-semibold text-slate-600">{item.date.slice(5)}</div>
                    </th>
                  ))}
                  <th className="p-3 text-center w-20">{t.action}</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {list.length === 0 ? (
                  <tr>
                    <td colSpan={PUJA_SCHEDULE.length + 3} className="p-6 text-center text-slate-400">
                      No {type} vehicles added yet.
                    </td>
                  </tr>
                ) : (
                  list.map(v => {
                    const isVehicleActive = v.is_active !== false;
                    return (
                      <tr key={v.id} className={`hover:bg-amber-50/40 transition ${!isVehicleActive ? 'bg-slate-100/70 opacity-70' : ''}`}>
                        <td className="p-3 font-semibold text-slate-700 sticky left-0 bg-white z-10 shadow-sm border-r border-slate-200">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-blue-700 text-[13px]">{v.model_name}</span>
                            <button
                              onClick={() => handleToggleMasterVehicle(v)}
                              className={`text-[9px] px-1.5 py-0.5 rounded font-bold uppercase border ${isVehicleActive ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-rose-50 text-rose-700 border-rose-300'}`}
                              title="Toggle master garage status"
                            >
                              {isVehicleActive ? '● ON' : '○ OFF'}
                            </button>
                          </div>
                          <div className="text-[10px] text-slate-400 font-normal">{v.registration_no || 'Reg Pending'}</div>
                        </td>
                        <td className="p-3 text-slate-600 font-medium">₹{v.daily_rent}</td>
                        {PUJA_SCHEDULE.map(item => {
                          const booking = getBookingForDate(v.id, item.date);
                          const isMaintenance = booking && booking.booking_status === 'maintenance';

                          return (
                            <td key={item.date} className="p-1 border-l border-slate-100 text-center">
                              {!isVehicleActive ? (
                                <div className="py-1.5 px-1 bg-slate-200 text-slate-600 rounded text-[10px] font-medium">
                                  {t.inGarage}
                                </div>
                              ) : isMaintenance ? (
                                <button
                                  onClick={() => handleCancelMaintenance(booking.id)}
                                  className="w-full py-1.5 px-1 bg-amber-100 text-amber-800 border border-amber-300 rounded text-[10px] font-bold hover:bg-amber-200 transition"
                                  title="Click to release from Garage"
                                >
                                  {t.garage}
                                </button>
                              ) : booking ? (
                                <button
                                  onClick={() => setSelectedBookingDetail({ booking, vehicle: v })}
                                  className="w-full py-1.5 px-1 bg-rose-100 text-rose-800 border border-rose-300 rounded text-[11px] font-bold hover:bg-rose-200 transition shadow-xs"
                                >
                                  {t.booked}
                                </button>
                              ) : (
                                <button
                                  onClick={() => {
                                    setSelectedSlot({ vehicle: v, date: item.date });
                                    setNewBooking({
                                      customer_name: '', customer_phone: '', customer_whatsapp: '',
                                      start_date: item.date, end_date: item.date,
                                      total_rent: v.daily_rent, advance_paid: 0, due_amount: v.daily_rent,
                                      security_deposit: '', original_id_collected: false
                                    });
                                    setMaintenanceRange({ start_date: item.date, end_date: item.date });
                                    setShowSlotActionModal(true);
                                  }}
                                  className="w-full py-1.5 px-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[11px] font-medium hover:bg-emerald-100 transition"
                                >
                                  {t.available}
                                </button>
                              )}
                            </td>
                          );
                        })}
                        <td className="p-2 text-center border-l border-slate-100">
                          <button
                            onClick={() => handleDeleteVehicle(v.id, v.model_name)}
                            className="text-slate-400 hover:text-rose-600 p-1"
                            title="Delete Vehicle"
                          >
                            <i className="fa-regular fa-trash-can"></i>
                          </button>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-[1600px] mx-auto">
          {/* Header */}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-200 gap-4 mb-6">
            <div>
              <div className="flex items-center gap-2">
                <span className="bg-blue-600 text-white font-black text-sm px-2 py-0.5 rounded shadow-sm">KD</span>
                <h1 className="text-2xl font-black tracking-tight text-slate-900 uppercase">KD Captain</h1>
              </div>
              <p className="text-xs text-slate-500 mt-1 font-medium">{t.subtitle}</p>
            </div>
            
            <div className="flex items-center gap-3">
              {/* Language Switcher */}
              <div className="flex bg-slate-200 p-0.5 rounded-lg text-xs font-bold">
                <button
                  onClick={() => setLang('en')}
                  className={`px-2.5 py-1 rounded-md transition ${lang === 'en' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600'}`}
                >
                  EN
                </button>
                <button
                  onClick={() => setLang('hi')}
                  className={`px-2.5 py-1 rounded-md transition ${lang === 'hi' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600'}`}
                >
                  हिन्दी
                </button>
              </div>

              <button
                onClick={() => setActiveTab('timeline')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'timeline' ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border text-slate-700 hover:bg-slate-50'}`}
              >
                <i className="fa-solid fa-calendar-days"></i> {t.tabTimeline}
              </button>
              <button
                onClick={() => setActiveTab('customers')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'customers' ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border text-slate-700 hover:bg-slate-50'}`}
              >
                <i className="fa-solid fa-users"></i> {t.tabCustomers} ({validBookings.length})
              </button>
            </div>
          </div>

          {/* Revenue Analytics Cards & Pie Charts */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div className="bg-white p-5 rounded-xl border border-blue-200 shadow-sm flex flex-col justify-between">
              <div>

                    <div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Customer Details</div>
                      <div className="font-bold text-slate-800">{showInvoiceModal.booking.customer_name}</div>
                      <div>Phone: {showInvoiceModal.booking.customer_phone}</div>
                      <div>WhatsApp: {showInvoiceModal.booking.customer_whatsapp}</div>
                    </div>
                    <div>
                      <div className="text-[10px] uppercase font-bold text-slate-400">Vehicle Assigned</div>
                      <div className="font-bold text-slate-800">{showInvoiceModal.vehicle.model_name}</div>
                      <div>Type: {showInvoiceModal.vehicle.vehicle_type.toUpperCase()}</div>
                      <div>Reg No: {showInvoiceModal.vehicle.registration_no || 'TBA'}</div>
                    </div>
                  </div>

                  {/* Rental Schedule & Pricing */}
                  <table className="w-full mb-4 border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 text-[10px] uppercase">
                        <th className="py-2 text-left">Description</th>
                        <th className="py-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      <tr>
                        <td className="py-2">Booking Period: {showInvoiceModal.booking.start_date} to {showInvoiceModal.booking.end_date}</td>
                        <td className="py-2 text-right">₹{showInvoiceModal.booking.total_rent}</td>
                      </tr>
                      <tr>
                        <td className="py-2 text-slate-500">Advance Paid (Collected)</td>
                        <td className="py-2 text-right text-emerald-600">- ₹{showInvoiceModal.booking.advance_paid || 0}</td>
                      </tr>
                      {showInvoiceModal.booking.security_deposit > 0 && (
                        <tr>
                          <td className="py-2 text-slate-500">Security Deposit (Refundable)</td>
                          <td className="py-2 text-right text-amber-600">₹{showInvoiceModal.booking.security_deposit}</td>
                        </tr>
                      )}
                      <tr className="font-bold text-slate-900 border-t border-slate-300">
                        <td className="py-2">Remaining Rent to Pay (Due at Handover)</td>
                        <td className="py-2 text-right text-rose-600">₹{Math.max(0, (showInvoiceModal.booking.total_rent || 0) - (showInvoiceModal.booking.advance_paid || 0))}</td>
                      </tr>
                    </tbody>
                  </table>

                  {/* Mandatory Terms & Conditions in English */}
                  <div className="border border-slate-200 rounded-lg p-3 bg-slate-50 space-y-1.5 text-[10px] text-slate-600 leading-relaxed mb-6">
                    <div className="font-bold text-slate-800 mb-1">TERMS & CONDITIONS:</div>
                    {showInvoiceModal.booking.security_deposit > 0 && (
                      <div>1. <strong>Security Deposit:</strong> A security deposit of ₹{showInvoiceModal.booking.security_deposit} is held for the duration of the rental. It will be 100% refunded upon the safe return of the vehicle without any damages.</div>
                    )}
                    <div>2. <strong>Payment Settlement:</strong> The due balance must be fully cleared before the keys are handed over on the pickup date.</div>
                    <div>3. <strong>Identity Proof:</strong> Submission of an Original Government Identity Proof is mandatory at the time of vehicle pickup for verification and security records.</div>
                    <div>4. <strong>Safe Operation:</strong> The hirer is fully liable for any traffic fines, speed violations, or accidental damage incurred during the rental tenure.</div>
                  </div>

                  <div className="flex justify-between items-end pt-4 border-t border-slate-200 text-[10px]">
                    <div>
                      <p className="text-slate-400">Authorized Signature</p>
                      <p className="font-bold mt-4">KD Captain Management</p>
                    </div>
                    <div>
                      <p className="text-slate-400">Customer Signature</p>
                      <p className="font-bold mt-4">_______________________</p>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-200">
                  <button onClick={() => setShowInvoiceModal(null)} className="px-4 py-2 bg-slate-100 rounded-lg text-xs font-medium text-slate-600">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium shadow-sm hover:bg-blue-700 flex items-center gap-1.5">
                    <i className="fa-solid fa-print"></i> Print Bill (PDF)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

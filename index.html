<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD Captain | Durga Puja 2026 Fleet, Timeline & Revenue</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Configuration
    const SUPABASE_URL = "https://ntlbyqhmhdryqdyxaevk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HRMQgDnzbWgKC2ocml3T5A_DrMQhE3Q";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Live Durga Puja 2026 Schedule starting from 08 Oct with 5-Color Repeating Scheme
    const PUJA_SCHEDULE = [
      { date: "2026-10-08", label: "Today / Pre-Puja", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-09", label: "Pre-Puja", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-10", label: "Mahalaya", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-11", label: "Pratipada", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-12", label: "Dwitiya", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-13", label: "Tritiya", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-14", label: "Chaturthi", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-15", label: "Panchami", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-16", label: "Maha Sasthi", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-17", label: "Maha Saptami", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-18", label: "Maha Asthami", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-19", label: "Maha Navami", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-20", label: "Vijaya Dashami", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-21", label: "Ekadashi", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-22", label: "Dwadashi", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-23", label: "Return Day", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" }
    ];

    const TRANSLATIONS = {
      en: {
        tagline: "Durga Puja 2026 Fleet & Revenue ERP (Kolkata / Delhi)",
        tabDashboard: "📊 Revenue Dashboard",
        tabTimeline: "🛵 Fleet & Timeline",
        tabCustomers: "📁 Customer Database",
        totalRevenue: "Total Revenue (Booked)",
        totalCollected: "Total Collected (Advance)",
        totalDue: "Total Due (Pending)",
        fleetStrength: "Fleet Vehicles",
        petrolGrid: "Petrol Scooty Dashboard",
        evGrid: "EV Scooty Dashboard",
        addPetrol: "+ Add Petrol Scooty",
        addEv: "+ Add EV Scooty",
        vehicle: "Vehicle / Model",
        action: "Action",
        inGarage: "IN GARAGE",
        garage: "GARAGE",
        booked: "BOOKED",
        available: "AVAILABLE"
      },
      hi: {
        tagline: "दुर्गा पूजा 2026 फ्लीट और रेवेन्यू ईआरपी (कोलकाता / दिल्ली)",
        tabDashboard: "📊 रेवेन्यू डैशबोर्ड",
        tabTimeline: "🛵 फ्लीट और टाइमलाइन",
        tabCustomers: "📁 कस्टमर डेटाबेस",
        totalRevenue: "कुल रेवेन्यू (बुकिंग मूल्य)",
        totalCollected: "कुल जमा राशि (एडवांस)",
        totalDue: "कुल बाकी रकम (डिलीवरी पर)",
        fleetStrength: "कुल गाड़ियां",
        petrolGrid: "पेट्रोल स्कूटी डैशबोर्ड",
        evGrid: "ईवी स्कूटी डैशबोर्ड",
        addPetrol: "+ पेट्रोल गाड़ी जोड़ें",
        addEv: "+ ईवी गाड़ी जोड़ें",
        vehicle: "गाड़ी / मॉडल",
        action: "कार्रवाई",
        inGarage: "गैराज में है",
        garage: "गैराज",
        booked: "बुक है",
        available: "खाली है"
      }
    };

    function App() {
      const [lang, setLang] = useState('en');
      const t = TRANSLATIONS[lang];

      const [activeTab, setActiveTab] = useState('timeline');
      const [activeDashboardFleet, setActiveDashboardFleet] = useState('petrol');

      const [vehicles, setVehicles] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [loading, setLoading] = useState(true);

      const [garageMap, setGarageMap] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('kd_garage_map') || '{}');
        } catch(e) { return {}; }
      });

      // Modals
      const [showAddVehicleModal, setShowAddVehicleModal] = useState(false);
      const [vehicleTypeToAdd, setVehicleTypeToAdd] = useState('petrol');
      const [showSlotActionModal, setShowSlotActionModal] = useState(false);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [showBookingModal, setShowBookingModal] = useState(false);
      const [selectedBookingDetail, setSelectedBookingDetail] = useState(null);
      const [showInvoiceModal, setShowInvoiceModal] = useState(null);

      // Forms
      const [newVehicle, setNewVehicle] = useState({ model_name: '', vehicle_type: 'petrol', registration_no: '' });
      const [editingBookingId, setEditingBookingId] = useState(null);
      const [newBooking, setNewBooking] = useState({
        customer_name: '',
        customer_name_hi: '',
        customer_phone: '',
        customer_whatsapp: '',
        booking_date: '2026-10-08',
        daily_rate: '800',
        slots: [{ start_date: '2026-10-08', end_date: '2026-10-08' }],
        total_rent: 800,
        advance_paid: 0,
        due_amount: 800,
        security_deposit: '',
        original_id_collected: false
      });

      const [maintenanceRange, setMaintenanceRange] = useState({ start_date: '', end_date: '' });

      const petrolChartRef = useRef(null);
      const evChartRef = useRef(null);
      const petrolChartInstance = useRef(null);
      const evChartInstance = useRef(null);

      const fetchData = async () => {
        try {
          const { data: vData } = await supabase.from('vehicles').select('*').order('created_at', { ascending: true });
          const { data: bData } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
          setVehicles(vData || []);
          setBookings(bData || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const toggleGarageStatus = (vehicleId) => {
        const nextMap = { ...garageMap, [vehicleId]: !garageMap[vehicleId] };
        setGarageMap(nextMap);
        localStorage.setItem('kd_garage_map', JSON.stringify(nextMap));
      };

      // Financials
      const validBookings = bookings.filter(b => b.booking_status !== 'maintenance');

      const petrolVehicles = vehicles.filter(v => v.vehicle_type === 'petrol');
      const petrolBookings = validBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'petrol';
      });
      const petrolRevenue = petrolBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const petrolCollected = petrolBookings.reduce((acc, b) => acc + (parseFloat(b.advance_paid) || 0), 0);
      const petrolDue = Math.max(0, petrolRevenue - petrolCollected);

      const evVehicles = vehicles.filter(v => v.vehicle_type === 'ev');
      const evBookings = validBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'ev';
      });
      const evRevenue = evBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const evCollected = evBookings.reduce((acc, b) => acc + (parseFloat(b.advance_paid) || 0), 0);
      const evDue = Math.max(0, evRevenue - evCollected);

      // Render Charts
      useEffect(() => {
        if (loading || activeTab !== 'dashboard') return;

        if (activeDashboardFleet === 'petrol' && petrolChartRef.current) {
          if (petrolChartInstance.current) petrolChartInstance.current.destroy();
          const ctx = petrolChartRef.current.getContext('2d');
          petrolChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: [lang === 'en' ? 'Collected (Advance)' : 'जमा राशि (एडवांस)', lang === 'en' ? 'Due Balance' : 'बाकी रकम'],
              datasets: [{
                data: [petrolCollected || 1, petrolDue || 0],
                backgroundColor: ['#10B981', '#F43F5E'],
                borderWidth: 3,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 12, weight: 'bold' } } } }
            }
          });
        }

        if (activeDashboardFleet === 'ev' && evChartRef.current) {
          if (evChartInstance.current) evChartInstance.current.destroy();
          const ctx = evChartRef.current.getContext('2d');
          evChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: [lang === 'en' ? 'Collected (Advance)' : 'जमा राशि (एडवांस)', lang === 'en' ? 'Due Balance' : 'बाकी रकम'],
              datasets: [{
                data: [evCollected || 1, evDue || 0],
                backgroundColor: ['#06B6D4', '#F43F5E'],
                borderWidth: 3,
                borderColor: '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 12, weight: 'bold' } } } }
            }
          });
        }
      }, [bookings, vehicles, loading, activeTab, activeDashboardFleet, lang]);

      const calculateAmounts = (slots, rate, advance) => {
        let totalDays = 0;
        slots.forEach(slot => {
          if (slot.start_date && slot.end_date) {
            const d1 = new Date(slot.start_date);
            const d2 = new Date(slot.end_date);
            const diff = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)));
            totalDays += diff;
          }
        });

        const r = parseFloat(rate) || 0;
        const total = totalDays * r;
        const adv = parseFloat(advance) || 0;
        const due = Math.max(0, total - adv);

        setNewBooking(prev => ({
          ...prev,
          slots,
          daily_rate: rate,
          total_rent: total,
          advance_paid: adv,
          due_amount: due
        }));
      };

      const handleSlotChange = (index, field, value) => {
        const updatedSlots = [...newBooking.slots];
        updatedSlots[index][field] = value;
        calculateAmounts(updatedSlots, newBooking.daily_rate, newBooking.advance_paid);
      };

      const addDateSlot = () => {
        const updatedSlots = [...newBooking.slots, { start_date: '', end_date: '' }];
        setNewBooking(prev => ({ ...prev, slots: updatedSlots }));
      };

      const removeDateSlot = (index) => {
        if (newBooking.slots.length <= 1) return;
        const updatedSlots = newBooking.slots.filter((_, i) => i !== index);
        calculateAmounts(updatedSlots, newBooking.daily_rate, newBooking.advance_paid);
      };

      const getBookingForDate = (vehicleId, dateStr) => {
        return bookings.find(b => {
          if (b.vehicle_id !== vehicleId) return false;
          if (b.additional_slots && Array.isArray(b.additional_slots)) {
            const inSlots = b.additional_slots.some(s => dateStr >= s.start_date && dateStr <= s.end_date);
            if (inSlots) return true;
          }
          return dateStr >= b.start_date && dateStr <= b.end_date;
        });
      };

      // Add Vehicle with Schema-Safe daily_rent: 0
      const handleAddVehicle = async (e) => {
        e.preventDefault();
        const payload = {
          model_name: newVehicle.model_name,
          vehicle_type: vehicleTypeToAdd,
          registration_no: newVehicle.registration_no || '',
          daily_rent: 0
        };

        const { error } = await supabase.from('vehicles').insert([payload]);

        if (!error) {
          setShowAddVehicleModal(false);
          setNewVehicle({ model_name: '', vehicle_type: 'petrol', registration_no: '' });
          fetchData();
        } else {
          alert('Error adding vehicle: ' + error.message);
        }
      };

      const handleDeleteVehicle = async (vehicleId, name) => {
        if (confirm(`Are you sure you want to permanently delete ${name}?`)) {
          const { error } = await supabase.from('vehicles').delete().eq('id', vehicleId);
          if (!error) fetchData();
          else alert('Error: ' + error.message);
        }
      };

      const handleSaveBooking = async (e) => {
        e.preventDefault();
        const firstSlot = newBooking.slots[0];
        const payload = {
          vehicle_id: selectedSlot.vehicle.id,
          customer_name: newBooking.customer_name,
          customer_name_hi: newBooking.customer_name_hi || newBooking.customer_name,
          customer_phone: newBooking.customer_phone,
          customer_whatsapp: newBooking.customer_whatsapp,
          booking_date: newBooking.booking_date,
          start_date: firstSlot.start_date,
          end_date: firstSlot.end_date,
          additional_slots: newBooking.slots,
          total_rent: parseFloat(newBooking.total_rent) || 0,
          advance_paid: parseFloat(newBooking.advance_paid) || 0,
          security_deposit: parseFloat(newBooking.security_deposit) || 0,
          deposit_adjusted: true,
          original_id_collected: newBooking.original_id_collected,
          booking_status: 'confirmed'
        };

        let res;
        if (editingBookingId) {
          res = await supabase.from('bookings').update(payload).eq('id', editingBookingId);
        } else {
          res = await supabase.from('bookings').insert([payload]);
        }

        if (!res.error) {
          setShowBookingModal(false);
          setEditingBookingId(null);
          fetchData();
        } else {
          alert('Error saving booking: ' + res.error.message);
        }
      };

      const openEditBooking = (booking, vehicle) => {
        setSelectedSlot({ vehicle, date: booking.start_date });
        setEditingBookingId(booking.id);
        const slots = booking.additional_slots && Array.isArray(booking.additional_slots) && booking.additional_slots.length > 0
          ? booking.additional_slots
          : [{ start_date: booking.start_date, end_date: booking.end_date }];

        const calculatedDays = slots.reduce((acc, s) => {
          const diff = Math.max(1, Math.round((new Date(s.end_date) - new Date(s.start_date)) / (1000 * 3600 * 24)));
          return acc + diff;
        }, 0);

        const inferredRate = calculatedDays > 0 ? Math.round(booking.total_rent / calculatedDays) : 800;

        setNewBooking({
          customer_name: booking.customer_name || '',
          customer_name_hi: booking.customer_name_hi || '',
          customer_phone: booking.customer_phone || '',
          customer_whatsapp: booking.customer_whatsapp || '',
          booking_date: booking.booking_date || '2026-10-08',
          daily_rate: inferredRate.toString(),
          slots,
          total_rent: booking.total_rent || 0,
          advance_paid: booking.advance_paid || 0,
          due_amount: Math.max(0, (booking.total_rent || 0) - (booking.advance_paid || 0)),
          security_deposit: booking.security_deposit || '',
          original_id_collected: booking.original_id_collected || false
        });

        setSelectedBookingDetail(null);
        setShowBookingModal(true);
      };

      const handleMarkMaintenance = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('bookings').insert([{
          vehicle_id: selectedSlot.vehicle.id,
          customer_name: 'GARAGE MAINTENANCE',
          customer_phone: 'N/A',
          customer_whatsapp: 'N/A',
          start_date: maintenanceRange.start_date,
          end_date: maintenanceRange.end_date,
          additional_slots: [{ start_date: maintenanceRange.start_date, end_date: maintenanceRange.end_date }],
          total_rent: 0,
          advance_paid: 0,
          security_deposit: 0,
          booking_status: 'maintenance'
        }]);

        if (!error) {
          setShowSlotActionModal(false);
          fetchData();
        } else alert('Error marking garage: ' + error.message);
      };

      const handleCancelMaintenance = async (maintenanceId) => {
        if (confirm('Release vehicle from Garage and make Available?')) {
          const { error } = await supabase.from('bookings').delete().eq('id', maintenanceId);
          if (!error) fetchData();
          else alert('Error: ' + error.message);
        }
      };

      const formatSlotDates = (booking) => {
        if (booking.additional_slots && Array.isArray(booking.additional_slots) && booking.additional_slots.length > 0) {
          return booking.additional_slots.map(s => `${s.start_date.slice(5)} to ${s.end_date.slice(5)}`).join(' & ');
        }
        return `${booking.start_date.slice(5)} to ${booking.end_date.slice(5)}`;
      };

      const sendWhatsAppInvoice = (booking, vehicle) => {
        const due = Math.max(0, (booking.total_rent || 0) - (booking.advance_paid || 0));
        const depositText = booking.security_deposit > 0 
          ? `🔒 *Security Deposit:* ₹${booking.security_deposit} (Refundable upon vehicle return)\n` 
          : ``;

        const text = `*KD CAPTAIN - DURGA PUJA 2026 BOOKING CONFIRMATION*\n\n` +
          `👤 *Customer Name:* ${booking.customer_name}\n` +
          `🛵 *Vehicle Model:* ${vehicle ? vehicle.model_name : 'Scooty'} (${vehicle ? vehicle.registration_no || 'Assigned' : ''})\n` +
          `📅 *Booked Slots:* ${formatSlotDates(booking)}\n` +
          `💰 *Total Rental Charge:* ₹${booking.total_rent}\n` +
          `💳 *Advance Received:* ₹${booking.advance_paid}\n` +
          `🔴 *Due Balance at Handover:* ₹${due}\n` +
          depositText +
          `🪪 *Mandatory Document:* Original ID Proof must be submitted at pickup.\n\n` +
          `Thank you for choosing KD Captain!`;
        
        const cleanNumber = booking.customer_whatsapp.replace(/\D/g, '');
        window.open(`https://wa.me/${cleanNumber.length === 10 ? '91' + cleanNumber : cleanNumber}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const renderGrid = (list, title, type, badgeColor) => (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-10">
          <div className="px-8 py-5 border-b border-slate-200 flex justify-between items-center bg-blue-50/60">
            <div className="flex items-center gap-4">
              <span className={`px-3.5 py-1 text-xs font-black tracking-wider rounded-lg uppercase ${badgeColor}`}>
                {type}
              </span>
              <h2 className="text-xl font-black text-slate-800 tracking-tight">{title}</h2>
              <span className="text-sm text-slate-500 font-bold">({list.length} {t.fleetStrength})</span>
            </div>
            <button
              onClick={() => { setVehicleTypeToAdd(type); setShowAddVehicleModal(true); }}
              className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-2"
            >
              <i className="fa-solid fa-plus text-sm"></i> {type === 'petrol' ? t.addPetrol : t.addEv}
            </button>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-blue-100 text-blue-950 border-b border-blue-200 font-black tracking-wide uppercase text-xs">
                  <th className="p-4 sticky left-0 bg-blue-100 z-10 w-60 shadow-sm">{t.vehicle}</th>
                  {PUJA_SCHEDULE.map(item => (
                    <th key={item.date} className="p-3 text-center min-w-[95px] border-l border-blue-200">
                      <div className={`text-[10px] py-1 px-1.5 rounded-lg border font-black tracking-tight mb-1 shadow-xs ${item.colorClass}`}>
                        {item.label}
                      </div>
                      <div className="text-xs font-black text-slate-700">{item.date.slice(5)}</div>
                    </th>
                  ))}
                  <th className="p-4 text-center w-20">{t.action}</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-xs">
                {list.length === 0 ? (
                  <tr>
                    <td colSpan={PUJA_SCHEDULE.length + 2} className="p-10 text-center text-slate-400 font-medium text-sm">
                      No {type} vehicles added yet. Click "+ Add" above to start your fleet.
                    </td>
                  </tr>
                ) : (
                  list.map(v => {
                    const isInGarage = !!garageMap[v.id];
                    return (
                      <tr key={v.id} className={`hover:bg-amber-50/40 transition ${isInGarage ? 'bg-slate-100/80 opacity-70' : ''}`}>
                        <td className="p-4 font-bold text-slate-800 sticky left-0 bg-white z-10 shadow-sm border-r border-slate-200">
                          <div className="flex items-center justify-between mb-1">
                            <span className="font-black text-blue-700 text-base">{v.model_name}</span>
                            <button
                              onClick={() => toggleGarageStatus(v.id)}
                              className={`text-[10px] px-2 py-0.5 rounded-md font-black uppercase border transition shadow-xs ${!isInGarage ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300'}`}
                              title="Toggle Active / Garage"
                            >
                              {!isInGarage ? '● LIVE' : '○ GARAGE'}
                            </button>
                          </div>
                          <div className="text-xs text-slate-400 font-semibold">{v.registration_no || 'Reg Pending'}</div>
                        </td>
                        {PUJA_SCHEDULE.map(item => {
                          const booking = getBookingForDate(v.id, item.date);
                          const isMaintenance = booking && booking.booking_status === 'maintenance';

                  <div className="grid grid-cols-2 gap-3 bg-amber-50/60 p-3 rounded-xl border border-amber-200">
                    <div>
                      <label className="block font-black text-amber-900 mb-1">Booking Date (কবে বুকিং নিল)</label>
                      <input
                        type="date"
                        required
                        value={newBooking.booking_date}
                        onChange={e => setNewBooking({ ...newBooking, booking_date: e.target.value })}
                        className="w-full p-2 border rounded-lg font-bold bg-white"
                      />
                    </div>
                    <div>
                      <label className="block font-black text-amber-900 mb-1">Per Day Rent (₹/দিন)</label>
                      <input
                        type="number"
                        required
                        placeholder="e.g. 800"
                        value={newBooking.daily_rate}
                        onChange={e => calculateAmounts(newBooking.slots, e.target.value, newBooking.advance_paid)}
                        className="w-full p-2 border rounded-lg font-bold bg-white"
                      />
                    </div>
                  </div>

                  {/* Multi-Date Slot Container */}
                  <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="font-black text-slate-800 uppercase tracking-wide text-[11px]">
                        📅 Rental Date Slots
                      </span>
                      <button
                        type="button"
                        onClick={addDateSlot}
                        className="text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 px-2.5 py-1 rounded-lg font-bold transition flex items-center gap-1"
                      >
                        <i className="fa-solid fa-plus"></i> Add More Dates
                      </button>
                    </div>

                    {newBooking.slots.map((slot, sIdx) => (
                      <div key={sIdx} className="bg-white p-2.5 rounded-lg border border-slate-200 relative">
                        <div className="flex justify-between items-center mb-1 text-[10px] font-bold text-slate-400">
                          <span>SLOT #{sIdx + 1}</span>
                          {newBooking.slots.length > 1 && (
                            <button
                              type="button"
                              onClick={() => removeDateSlot(sIdx)}
                              className="text-rose-500 hover:text-rose-700"
                              title="Remove slot"
                            >
                              <i className="fa-solid fa-trash-can"></i>
                            </button>
                          )}
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-[10px] font-bold text-slate-500">Start Date</label>
                            <input
                              type="date"
                              required
                              value={slot.start_date}
                              onChange={e => handleSlotChange(sIdx, 'start_date', e.target.value)}
                              className="w-full p-1.5 border rounded-md font-bold text-xs"
                            />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-500">End Date</label>
                            <input
                              type="date"
                              required
                              value={slot.end_date}
                              onChange={e => handleSlotChange(sIdx, 'end_date', e.target.value)}
                              className="w-full p-1.5 border rounded-md font-bold text-xs"
                            />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Auto-Calculated Amounts */}
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-black text-slate-700 mb-1">Total Rent (Auto)</label>
                      <input
                        type="number"
                        readOnly
                        value={newBooking.total_rent}
                        className="w-full px-3 py-2 border rounded-xl bg-blue-50 font-black text-blue-700 outline-none cursor-not-allowed text-sm"
                      />
                    </div>
                    <div>
                      <label className="block font-black text-slate-700 mb-1">Advance (উঠেছে)</label>
                      <input
                        type="number"
                        placeholder="e.g. 1000"
                        value={newBooking.advance_paid}
                        onChange={e => {
                          const val = e.target.value;
                          const adv = parseFloat(val) || 0;
                          setNewBooking(prev => ({
                            ...prev,
                            advance_paid: val,
                            due_amount: Math.max(0, (prev.total_rent || 0) - adv)
                          }));
                        }}
                        className="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 font-black text-emerald-700 outline-none text-sm"
                      />
                    </div>
                    <div>
                      <label className="block font-black text-slate-700 mb-1">Due Amount (বাকি)</label>
                      <input
                        type="number"
                        readOnly
                        value={newBooking.due_amount}
                        className="w-full px-3 py-2 border rounded-xl bg-rose-50 font-black text-rose-700 outline-none cursor-not-allowed text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-black text-slate-700 mb-1">Security Deposit (₹) <span className="text-slate-400 font-normal">(Optional)</span></label>
                    <input
                      type="number"
                      placeholder="Leave empty or enter amount (e.g. 1000)"
                      value={newBooking.security_deposit}
                      onChange={e => setNewBooking({ ...newBooking, security_deposit: e.target.value })}
                      className="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-bold"
                    />
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input
                      type="checkbox"
                      id="origId"
                      checked={newBooking.original_id_collected}
                      onChange={e => setNewBooking({ ...newBooking, original_id_collected: e.target.checked })}
                      className="rounded text-blue-600"
                    />
                    <label htmlFor="origId" className="text-slate-700 font-bold">Original ID Proof collected</label>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setShowBookingModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-600 text-white rounded-xl font-black shadow-md hover:bg-emerald-700">
                      {editingBookingId ? 'Update Booking' : 'Confirm Booking'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: View Booking Details */}
          {selectedBookingDetail && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                  <h3 className="text-lg font-black text-slate-900">Booking Summary</h3>
                  <button onClick={() => setSelectedBookingDetail(null)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-xl"></i>
                  </button>
                </div>
                <div className="space-y-3 text-xs text-slate-700">
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Customer Name:</span>
                    <span className="font-black text-slate-900 text-sm">{selectedBookingDetail.booking.customer_name}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Booked On:</span>
                    <span className="font-bold text-blue-600">{selectedBookingDetail.booking.booking_date || selectedBookingDetail.booking.start_date}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Contact:</span>
                    <span>{selectedBookingDetail.booking.customer_phone}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">WhatsApp:</span>
                    <span className="font-black text-emerald-600">{selectedBookingDetail.booking.customer_whatsapp}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Vehicle:</span>
                    <span className="font-black text-blue-700 text-sm">{selectedBookingDetail.vehicle.model_name}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Booked Dates:</span>
                    <span className="font-black text-blue-600">{formatSlotDates(selectedBookingDetail.booking)}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Total Rent:</span>
                    <span className="font-black text-slate-900 text-sm">₹{selectedBookingDetail.booking.total_rent}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Advance (উঠেছে):</span>
                    <span className="font-black text-emerald-600 text-sm">₹{selectedBookingDetail.booking.advance_paid}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Due (বাকি):</span>
                    <span className="font-black text-rose-600 text-sm">₹{Math.max(0, (selectedBookingDetail.booking.total_rent || 0) - (selectedBookingDetail.booking.advance_paid || 0))}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500 font-bold">Security Deposit:</span>
                    <span className="font-black text-amber-600">{selectedBookingDetail.booking.security_deposit ? `₹${selectedBookingDetail.booking.security_deposit}` : 'N/A'}</span>
                  </div>
                </div>

                <div className="flex flex-col gap-2.5 pt-6">
                  <button
                    onClick={() => openEditBooking(selectedBookingDetail.booking, selectedBookingDetail.vehicle)}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition"
                  >
                    <i className="fa-solid fa-pen-to-square text-base"></i> Edit Booking / Dates
                  </button>
                  <button
                    onClick={() => sendWhatsAppInvoice(selectedBookingDetail.booking, selectedBookingDetail.vehicle)}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition"
                  >
                    <i className="fa-brands fa-whatsapp text-base"></i> Send WhatsApp Confirmation
                  </button>
                  <button
                    onClick={() => {
                      setShowInvoiceModal(selectedBookingDetail);
                      setSelectedBookingDetail(null);
                    }}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition"
                  >
                    <i className="fa-solid fa-file-invoice text-base"></i> View / Print Official Bill
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Printable Invoice */}
          {showInvoiceModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-8 border border-slate-200">
                <div id="printable-invoice" className="text-slate-800 text-xs">
                  <div className="border-b-2 border-slate-800 pb-4 mb-4 flex justify-between items-start">
                    <div>
                      <h1 className="text-2xl font-black tracking-tight text-slate-900">KD CAPTAIN</h1>
                      <p className="text-xs text-slate-500 font-bold">Two-Wheeler Rental Service | Durga Puja 2026</p>
                      <p className="text-xs text-slate-500 font-bold">Kolkata / Delhi</p>
                    </div>
                    <div className="text-right">
                      <div className="text-lg font-black text-slate-800">RENTAL RECEIPT</div>
                      <div className="text-xs text-slate-400 font-semibold">Date: {new Date().toLocaleDateString()}</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                      <div className="text-[10px] uppercase font-black text-slate-400 tracking-wider">Customer Details</div>
                      <div className="font-black text-slate-900 text-sm mt-1">{showInvoiceModal.booking.customer_name}</div>
                      <div className="font-bold">Phone: {showInvoiceModal.booking.customer_phone}</div>
                      <div className="font-bold">WhatsApp: {showInvoiceModal.booking.customer_whatsapp}</div>
                    </div>
                    <div>
                      <div className="text-[10px] uppercase font-black text-slate-400 tracking-wider">Vehicle Assigned</div>
                      <div className="font-black text-blue-700 text-sm mt-1">{showInvoiceModal.vehicle.model_name}</div>
                      <div className="font-bold">Type: {showInvoiceModal.vehicle.vehicle_type.toUpperCase()}</div>
                      <div className="font-bold">Reg No: {showInvoiceModal.vehicle.registration_no || 'TBA'}</div>
                    </div>
                  </div>

                  <table className="w-full mb-4 border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 text-[10px] uppercase font-black">
                        <th className="py-2 text-left">Description</th>
                        <th className="py-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-bold">
                      <tr>
                        <td className="py-2.5">Rental Slots: {formatSlotDates(showInvoiceModal.booking)}</td>
                        <td className="py-2.5 text-right font-black">₹{showInvoiceModal.booking.total_rent}</td>
                      </tr>
                      <tr>
                        <td className="py-2.5 text-slate-500">Advance Paid (Collected)</td>
                        <td className="py-2.5 text-right text-emerald-600 font-black">- ₹{showInvoiceModal.booking.advance_paid || 0}</td>
                      </tr>
                      {showInvoiceModal.booking.security_deposit > 0 && (
                        <tr>
                          <td className="py-2.5 text-slate-500">Security Deposit (Refundable)</td>
                          <td className="py-2.5 text-right text-amber-600 font-black">₹{showInvoiceModal.booking.security_deposit}</td>
                        </tr>
                      )}
                      <tr className="font-black text-slate-900 border-t border-slate-300 text-sm">
                        <td className="py-2.5">Remaining Rent to Pay (Due at Handover)</td>
                        <td className="py-2.5 text-right text-rose-600">₹{Math.max(0, (showInvoiceModal.booking.total_rent || 0) - (showInvoiceModal.booking.advance_paid || 0))}</td>
                      </tr>
                    </tbody>
                  </table>

                  <div className="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2 text-[11px] text-slate-600 leading-relaxed mb-6 font-medium">
                    <div className="font-black text-slate-900 text-xs mb-1">TERMS & CONDITIONS:</div>
                    {showInvoiceModal.booking.security_deposit > 0 && (
                      <div>1. <strong>Security Deposit:</strong> A security deposit of ₹{showInvoiceModal.booking.security_deposit} is held for the duration of the rental. It will be 100% refunded upon the safe return of the vehicle without damages.</div>
                    )}
                    <div>2. <strong>Payment Settlement:</strong> The due balance must be fully cleared before the keys are handed over on the pickup date.</div>
                    <div>3. <strong>Identity Proof:</strong> Submission of an Original Government Identity Proof is mandatory at the time of vehicle pickup for verification and security records.</div>
                    <div>4. <strong>Safe Operation:</strong> The hirer is fully liable for any traffic fines, speed violations, or accidental damage incurred during the rental tenure.</div>
                  </div>

                  <div className="flex justify-between items-end pt-4 border-t border-slate-200 text-xs font-bold">
                    <div>
                      <p className="text-slate-400">Authorized Signature</p>
                      <p className="font-black mt-4">KD Captain Management</p>
                    </div>
                    <div>
                      <p className="text-slate-400">Customer Signature</p>
                      <p className="font-black mt-4">_______________________</p>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-200">
                  <button onClick={() => setShowInvoiceModal(null)} className="px-5 py-2.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-600">Close</button>
                  <button onClick={() => window.print()} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-black shadow-md hover:bg-blue-700 flex items-center gap-2">
                    <i className="fa-solid fa-print"></i> Print Bill (PDF)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

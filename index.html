<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD Captain | Durga Puja 2026 Fleet, Timeline & Revenue ERP</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Configuration
    const SUPABASE_URL = "https://ntlbyqhmhdryqdyxaevk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HRMQgDnzbWgKC2ocml3T5A_DrMQhE3Q";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Live Durga Puja 2026 Schedule (Starting from 08 Oct with 5-Color Repeating Scheme)
    const BASE_PUJA_SCHEDULE = [
      { date: "2026-10-08", label: "Today / Pre-Puja", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-09", label: "Pre-Puja", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-10", label: "Mahalaya", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-11", label: "Pratipada", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-12", label: "Dwitiya", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-13", label: "Tritiya", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-14", label: "Chaturthi", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-15", label: "Panchami", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-16", label: "Maha Sasthi", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-17", label: "Maha Saptami", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-18", label: "Maha Asthami", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" },
      { date: "2026-10-19", label: "Maha Navami", colorClass: "text-emerald-700 bg-emerald-50 border-emerald-200" },
      { date: "2026-10-20", label: "Vijaya Dashami", colorClass: "text-amber-700 bg-amber-50 border-amber-200" },
      { date: "2026-10-21", label: "Ekadashi", colorClass: "text-purple-700 bg-purple-50 border-purple-200" },
      { date: "2026-10-22", label: "Dwadashi", colorClass: "text-teal-700 bg-teal-50 border-teal-200" },
      { date: "2026-10-23", label: "Return Day", colorClass: "text-indigo-700 bg-indigo-50 border-indigo-200" }
    ];

    const TRANSLATIONS = {
      en: {
        tagline: "Durga Puja 2026 Fleet & Revenue ERP (Kolkata / Delhi)",
        tabDashboard: "📊 Revenue Dashboard",
        tabTimeline: "🛵 Fleet & Timeline",
        tabCustomers: "📁 Customer Database",
        tabRecycle: "🗑️ Recycle Bin",
        totalRevenue: "Total Revenue (Booked)",
        totalCollected: "Total Collected (Advance)",
        totalDue: "Total Due (Pending)",
        fleetStrength: "Fleet Vehicles",
        petrolGrid: "Petrol Scooty Dashboard",
        evGrid: "EV Scooty Dashboard",
        addPetrol: "+ Add Petrol Scooty",
        addEv: "+ Add EV Scooty",
        vehicle: "Vehicle / Model",
        action: "Action"
      },
      hi: {
        tagline: "दुर्गा पूजा 2026 फ्लीट और रेवेन्यू ईआरपी (कोलकाता / दिल्ली)",
        tabDashboard: "📊 रेवेन्यू डैशबोर्ड",
        tabTimeline: "🛵 फ्लीट और टाइमलाइन",
        tabCustomers: "📁 कस्टमर डेटाबेस",
        tabRecycle: "🗑️ रीसायकल बिन",
        totalRevenue: "कुल रेवेन्यू (बुकिंग मूल्य)",
        totalCollected: "कुल जमा राशि (एडवांस)",
        totalDue: "कुल बाकी रकम (डिलीवरी पर)",
        fleetStrength: "कुल गाड़ियां",
        petrolGrid: "पेट्रोल स्कूटी डैशबोर्ड",
        evGrid: "ईवी स्कूटी डैशबोर्ड",
        addPetrol: "+ पेट्रोल गाड़ी जोड़ें",
        addEv: "+ ईवी गाड़ी जोड़ें",
        vehicle: "गाड़ी / मॉडल",
        action: "कार्रवाई"
      }
    };

    function App() {
      const [lang, setLang] = useState('en');
      const t = TRANSLATIONS[lang];

      const [activeTab, setActiveTab] = useState('timeline');
      const [activeDashboardFleet, setActiveDashboardFleet] = useState('petrol');

      const [vehicles, setVehicles] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [loading, setLoading] = useState(true);

      // Local Storage Maps for Persistent Operations
      const [masterGarageMap, setMasterGarageMap] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kd_master_garage_map') || '{}'); } catch(e) { return {}; }
      });
      const [dateGarageMap, setDateGarageMap] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kd_date_garage_map') || '{}'); } catch(e) { return {}; }
      });
      const [bookingMetaMap, setBookingMetaMap] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kd_booking_meta_map') || '{}'); } catch(e) { return {}; }
      });
      // Date Splitting Storage: { "YYYY-MM-DD": { isSplit: true, time: "08:00 PM" } }
      const [dateSplitMap, setDateSplitMap] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kd_date_split_map') || '{}'); } catch(e) { return {}; }
      });

      // Modals
      const [showAddVehicleModal, setShowAddVehicleModal] = useState(false);
      const [showEditVehicleModal, setShowEditVehicleModal] = useState(false);
      const [editingVehicleData, setEditingVehicleData] = useState(null);
      const [vehicleTypeToAdd, setVehicleTypeToAdd] = useState('petrol');

      const [showSlotActionModal, setShowSlotActionModal] = useState(false);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [showBookingModal, setShowBookingModal] = useState(false);
      const [selectedBookingDetail, setSelectedBookingDetail] = useState(null);
      const [showInvoiceModal, setShowInvoiceModal] = useState(null);
      const [showSwapModal, setShowSwapModal] = useState(false);
      const [swapBookingTarget, setSwapBookingTarget] = useState(null);

      // Vehicle Form State
      const [newVehicle, setNewVehicle] = useState({ model_name: '', vehicle_type: 'petrol', registration_no: '' });
      
      // Booking Form State
      const [editingBookingId, setEditingBookingId] = useState(null);
      const [newBooking, setNewBooking] = useState({
        customer_name: '',
        customer_phone: '',
        customer_whatsapp: '',
        booking_date: '2026-10-08',
        preferred_model: '',
        daily_rate: '800',
        slots: [{ start_date: '2026-10-08', end_date: '2026-10-08', turnover_time: '' }],
        total_rent: 800,
        advance_paid: 0,
        due_amount: 800,
        security_deposit: '1000',
        original_id_collected: false
      });
      const [dateOverlapError, setDateOverlapError] = useState('');

      // Turnover Split Input in Slot Modal
      const [slotTurnoverTime, setSlotTurnoverTime] = useState('08:00 PM');

      // Dedicated Chart References
      const petrolChartRef = useRef(null);
      const evChartRef = useRef(null);
      const petrolChartInstance = useRef(null);
      const evChartInstance = useRef(null);

      const fetchData = async () => {
        try {
          const { data: vData } = await supabase.from('vehicles').select('*').order('created_at', { ascending: true });
          const { data: bData } = await supabase.from('bookings').select('*').order('created_at', { ascending: false });
          setVehicles(vData || []);
          setBookings(bData || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filter Active vs Recycled Bookings
      const activeBookings = bookings.filter(b => b.booking_status !== 'cancelled' && b.booking_status !== 'maintenance');
      const recycledBookings = bookings.filter(b => b.booking_status === 'cancelled');

      // Separate Fleet Financial Calculations
      const petrolVehicles = vehicles.filter(v => v.vehicle_type === 'petrol');
      const petrolBookings = activeBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'petrol';
      });
      const petrolRevenue = petrolBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const petrolCollected = petrolBookings.reduce((acc, b) => acc + (parseFloat(b.advance_paid) || 0), 0);
      const petrolDue = Math.max(0, petrolRevenue - petrolCollected);

      const evVehicles = vehicles.filter(v => v.vehicle_type === 'ev');
      const evBookings = activeBookings.filter(b => {
        const v = vehicles.find(veh => veh.id === b.vehicle_id);
        return v && v.vehicle_type === 'ev';
      });
      const evRevenue = evBookings.reduce((acc, b) => acc + (parseFloat(b.total_rent) || 0), 0);
      const evCollected = evBookings.reduce((acc, b) => acc + (parseFloat(b.advance_paid) || 0), 0);
      const evDue = Math.max(0, evRevenue - evCollected);

      // Render Charts for Dedicated Dashboards
      useEffect(() => {
        if (loading || activeTab !== 'dashboard') return;

        if (activeDashboardFleet === 'petrol' && petrolChartRef.current) {
          if (petrolChartInstance.current) petrolChartInstance.current.destroy();
          const ctx = petrolChartRef.current.getContext('2d');
          petrolChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Collected (Advance)', 'Due Balance'],
              datasets: [{
                data: [petrolCollected || 1, petrolDue || 0],
                backgroundColor: ['#10B981', '#F43F5E'],
                borderWidth: 3,
                borderColor: '#ffffff'
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }

        if (activeDashboardFleet === 'ev' && evChartRef.current) {
          if (evChartInstance.current) evChartInstance.current.destroy();
          const ctx = evChartRef.current.getContext('2d');
          evChartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Collected (Advance)', 'Due Balance'],
              datasets: [{
                data: [evCollected || 1, evDue || 0],
                backgroundColor: ['#06B6D4', '#F43F5E'],
                borderWidth: 3,
                borderColor: '#ffffff'
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
      }, [bookings, vehicles, loading, activeTab, activeDashboardFleet]);

      // Dynamic Schedule Generation with Same-Day Splitting
      const computedSchedule = [];
      BASE_PUJA_SCHEDULE.forEach(item => {
        const splitConfig = dateSplitMap[item.date];
        if (splitConfig && splitConfig.isSplit) {
          computedSchedule.push({
            date: item.date,
            subSlot: 'part1',
            label: `${item.label} (Till ${splitConfig.time})`,
            displayDate: `${item.date.slice(5)} (${splitConfig.time})`,
            colorClass: item.colorClass
          });
          computedSchedule.push({
            date: item.date,
            subSlot: 'part2',
            label: `${item.label} (From ${splitConfig.time})`,
            displayDate: `${item.date.slice(5)} (After ${splitConfig.time})`,
            colorClass: item.colorClass
          });
        } else {
          computedSchedule.push({
            date: item.date,
            subSlot: null,
            label: item.label,
            displayDate: item.date.slice(5),
            colorClass: item.colorClass
          });
        }
      });

      // Overlap Checker across multi-slots
      const checkSlotOverlaps = (slots) => {
        for (let i = 0; i < slots.length; i++) {
          for (let j = i + 1; j < slots.length; j++) {
            const s1 = slots[i];
            const s2 = slots[j];
            if (s1.start_date && s1.end_date && s2.start_date && s2.end_date) {
              if (!(s1.end_date < s2.start_date || s1.start_date > s2.end_date)) {
                return true;
              }
            }
          }
        }
        return false;
      };

      // Calculate Total Days & Rent for Multiple Slots
      const calculateMultiSlotAmounts = (slots, rate, advance) => {
        let totalDays = 0;
        const hasOverlap = checkSlotOverlaps(slots);
        if (hasOverlap) {
          setDateOverlapError('Warning: Slot dates overlap with each other! Please select separate non-conflicting dates.');
        } else {
          setDateOverlapError('');
        }

        slots.forEach(slot => {
          if (slot.start_date && slot.end_date) {
            const d1 = new Date(slot.start_date);
            const d2 = new Date(slot.end_date);
            const days = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)) + 1);
            totalDays += days;
          }
        });

        const r = parseFloat(rate) || 0;
        const total = totalDays * r;
        const adv = parseFloat(advance) || 0;
        const due = Math.max(0, total - adv);

        setNewBooking(prev => ({
          ...prev,
          slots,
          daily_rate: rate,
          total_rent: total,
          advance_paid: adv,
          due_amount: due
        }));
      };

      const handleSlotChange = (index, field, value) => {
        const updatedSlots = [...newBooking.slots];
        updatedSlots[index][field] = value;
        calculateMultiSlotAmounts(updatedSlots, newBooking.daily_rate, newBooking.advance_paid);
      };

      const addDateSlot = () => {
        const updatedSlots = [...newBooking.slots, { start_date: '', end_date: '', turnover_time: '' }];
        setNewBooking(prev => ({ ...prev, slots: updatedSlots }));
      };

      const removeDateSlot = (index) => {
        if (newBooking.slots.length <= 1) return;
        const updatedSlots = newBooking.slots.filter((_, i) => i !== index);
        calculateMultiSlotAmounts(updatedSlots, newBooking.daily_rate, newBooking.advance_paid);
      };

      const getBookingForSlot = (vehicleId, dateStr, subSlot) => {
        return activeBookings.find(b => {
          if (b.vehicle_id !== vehicleId) return false;
          const meta = bookingMetaMap[b.id] || {};
          if (subSlot === 'part2') {
            return meta.subSlot === 'part2' && dateStr >= b.start_date && dateStr <= b.end_date;
          }
          if (subSlot === 'part1') {
            return meta.subSlot !== 'part2' && dateStr >= b.start_date && dateStr <= b.end_date;
          }
          return dateStr >= b.start_date && dateStr <= b.end_date;
        });
      };

      // Toggle Master Garage (Entire row on/off)
      const toggleMasterGarage = (vehicleId) => {
        const nextMap = { ...masterGarageMap, [vehicleId]: !masterGarageMap[vehicleId] };
        setMasterGarageMap(nextMap);
        localStorage.setItem('kd_master_garage_map', JSON.stringify(nextMap));
      };

      // 1-Click Toggle Specific Date Garage
      const toggleSpecificDateGarage = (vehicleId, dateStr) => {
        const key = `${vehicleId}_${dateStr}`;
        const nextMap = { ...dateGarageMap, [key]: !dateGarageMap[key] };
        setDateGarageMap(nextMap);
        localStorage.setItem('kd_date_garage_map', JSON.stringify(nextMap));
        setShowSlotActionModal(false);
      };

      // Toggle Date Splitting on Timeline
      const handleToggleDateSplit = (dateStr, timeStr) => {
        const nextMap = { ...dateSplitMap };
        if (nextMap[dateStr] && nextMap[dateStr].isSplit) {
          delete nextMap[dateStr];
        } else {
          nextMap[dateStr] = { isSplit: true, time: timeStr || '08:00 PM' };
        }
        setDateSplitMap(nextMap);
        localStorage.setItem('kd_date_split_map', JSON.stringify(nextMap));
      };

      // Check Unique Vehicle Model Name
      const checkDuplicateModelName = (name, excludeVehicleId = null) => {
        const normalized = name.trim().toLowerCase();
        return vehicles.some(v => v.id !== excludeVehicleId && v.model_name.trim().toLowerCase() === normalized);
      };

      // Add Vehicle with Duplicate Guard
      const handleAddVehicle = async (e) => {
        e.preventDefault();
        const cleanName = newVehicle.model_name.trim();

        if (checkDuplicateModelName(cleanName)) {
          alert(`A vehicle with the name "${cleanName}" already exists! Please use a unique name like "${cleanName} 1" or "${cleanName} Red".`);
          return;
        }

        const payload = {
          model_name: cleanName,
          vehicle_type: vehicleTypeToAdd,
          registration_no: newVehicle.registration_no.trim() || '',
          daily_rent: 0
        };

        const { error } = await supabase.from('vehicles').insert([payload]);
        if (!error) {
          setShowAddVehicleModal(false);
          setNewVehicle({ model_name: '', vehicle_type: 'petrol', registration_no: '' });
          fetchData();
        } else {
          alert('Error adding vehicle: ' + error.message);
        }
      };

      // Edit Vehicle with Duplicate Guard
      const handleUpdateVehicle = async (e) => {
        e.preventDefault();
        const cleanName = editingVehicleData.model_name.trim();

        if (checkDuplicateModelName(cleanName, editingVehicleData.id)) {
          alert(`A vehicle with the name "${cleanName}" already exists! Please enter a unique identifier.`);
          return;
        }

        const payload = {
          model_name: cleanName,
          registration_no: editingVehicleData.registration_no.trim() || ''
        };

        const { error } = await supabase.from('vehicles').update(payload).eq('id', editingVehicleData.id);
        if (!error) {
          setShowEditVehicleModal(false);
          setEditingVehicleData(null);
          fetchData();
        } else {
          alert('Error updating vehicle: ' + error.message);
        }
      };

      // Save Booking with Mandatory 10-Digit Mobile Validation & Metadata Persistence
      const handleSaveBooking = async (e) => {
        e.preventDefault();

        if (dateOverlapError) {
          alert('Please resolve slot date overlap before saving!');
          return;
        }

        const phoneClean = newBooking.customer_phone.replace(/\D/g, '');
        if (phoneClean.length !== 10) {
          alert('Error: Please enter a valid 10-digit mobile number!');
          return;
        }

        const firstSlot = newBooking.slots[0];
        const lastSlot = newBooking.slots[newBooking.slots.length - 1];

        const payload = {
          vehicle_id: selectedSlot.vehicle.id,
          customer_name: newBooking.customer_name.trim(),
          customer_phone: phoneClean,
          customer_whatsapp: newBooking.customer_whatsapp.replace(/\D/g, '') || phoneClean,
          start_date: firstSlot.start_date,
          end_date: lastSlot.end_date || firstSlot.end_date,
          total_rent: parseFloat(newBooking.total_rent) || 0,
          advance_paid: parseFloat(newBooking.advance_paid) || 0,
          security_deposit: parseFloat(newBooking.security_deposit) || 0,
          deposit_adjusted: true,
          original_id_collected: newBooking.original_id_collected,
          booking_status: 'confirmed'
        };

        let res;
        let savedId;
        if (editingBookingId) {
          res = await supabase.from('bookings').update(payload).eq('id', editingBookingId);
          savedId = editingBookingId;
        } else {
          res = await supabase.from('bookings').insert([payload]).select();
          if (res.data && res.data[0]) {
            savedId = res.data[0].id;
          }
        }

        if (!res.error) {
          if (savedId) {
            const nextMap = {
              ...bookingMetaMap,
              [savedId]: {
                booking_date: newBooking.booking_date,
                preferred_model: newBooking.preferred_model ? newBooking.preferred_model.trim() : '',
                subSlot: selectedSlot.subSlot || null
              }
            };
            setBookingMetaMap(nextMap);
            localStorage.setItem('kd_booking_meta_map', JSON.stringify(nextMap));
          }
          setShowBookingModal(false);
          setEditingBookingId(null);
          fetchData();
        } else {
          alert('Error saving booking: ' + res.error.message);
        }
      };

      // Open Edit Booking Modal
      const openEditBooking = (booking, vehicle) => {
        setSelectedSlot({ vehicle, date: booking.start_date, subSlot: (bookingMetaMap[booking.id] || {}).subSlot });
        setEditingBookingId(booking.id);
        const slots = [{ start_date: booking.start_date, end_date: booking.end_date, turnover_time: '' }];

        const d1 = new Date(booking.start_date);
        const d2 = new Date(booking.end_date);
        const days = Math.max(1, Math.round((d2 - d1) / (1000 * 3600 * 24)) + 1);
        const inferredRate = Math.round((booking.total_rent || 800) / days);

        const meta = bookingMetaMap[booking.id] || {};
        const savedBookingDate = meta.booking_date || (booking.created_at ? booking.created_at.split('T')[0] : '2026-10-08');
        const savedPreferred = meta.preferred_model || '';

        setNewBooking({
          customer_name: booking.customer_name || '',
          customer_phone: booking.customer_phone || '',
          customer_whatsapp: booking.customer_whatsapp || '',
          booking_date: savedBookingDate,
          preferred_model: savedPreferred,
          daily_rate: inferredRate.toString(),
          slots,
          total_rent: booking.total_rent || 0,
          advance_paid: booking.advance_paid || 0,
          due_amount: Math.max(0, (booking.total_rent || 0) - (booking.advance_paid || 0)),
          security_deposit: (booking.security_deposit || 1000).toString(),
          original_id_collected: booking.original_id_collected || false
        });

        setSelectedBookingDetail(null);
        setShowBookingModal(true);
      };

      // Emergency Vehicle Swap
      const handleSwapVehicle = async (targetVehicleId) => {
        if (!swapBookingTarget) return;
        const targetVehicle = vehicles.find(v => v.id === targetVehicleId);
        if (!targetVehicle) return;

        const conflict = activeBookings.find(b => b.vehicle_id === targetVehicleId && !(b.end_date < swapBookingTarget.start_date || b.start_date > swapBookingTarget.end_date));
        if (conflict) {
          alert(`Cannot swap: ${targetVehicle.model_name} is already booked on those dates!`);
          return;
        }

        const { error } = await supabase.from('bookings').update({ vehicle_id: targetVehicleId }).eq('id', swapBookingTarget.id);
        if (!error) {
          alert(`Successfully swapped booking to ${targetVehicle.model_name}!`);
          setShowSwapModal(false);
          setSwapBookingTarget(null);
          fetchData();
        } else alert(error.message);
      };

                <div className="flex flex-col gap-2 pt-5">
                  <button
                    onClick={() => sendWhatsAppInvoice(selectedBookingDetail.booking, selectedBookingDetail.vehicle)}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2"
                  >
                    <i className="fa-brands fa-whatsapp text-base"></i> Send WhatsApp Bill
                  </button>
                  <button
                    onClick={() => {
                      setShowInvoiceModal(selectedBookingDetail);
                      setSelectedBookingDetail(null);
                    }}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl text-xs flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-file-invoice text-base"></i> View / Print PDF Official Bill
                  </button>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      onClick={() => {
                        setSwapBookingTarget(selectedBookingDetail.booking);
                        setShowSwapModal(true);
                        setSelectedBookingDetail(null);
                      }}
                      className="py-2 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl text-xs flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-arrows-rotate"></i> Emergency Swap
                    </button>
                    <button
                      onClick={() => handleMoveToRecycleBin(selectedBookingDetail.booking.id)}
                      className="py-2 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl text-xs flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-trash-can"></i> Recycle Bin
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Emergency Vehicle Swap */}
          {showSwapModal && swapBookingTarget && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-black text-slate-900">Emergency Vehicle Swap</h3>
                  <button onClick={() => setShowSwapModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-600 mb-4 font-semibold">
                  Select available vehicle to shift booking of <strong>{swapBookingTarget.customer_name}</strong>:
                </p>
                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {vehicles.filter(v => v.id !== swapBookingTarget.vehicle_id).map(v => (
                    <button
                      key={v.id}
                      onClick={() => handleSwapVehicle(v.id)}
                      className="w-full p-2.5 text-left border rounded-xl hover:bg-blue-50 hover:border-blue-300 transition flex justify-between items-center"
                    >
                      <div>
                        <div className="font-black text-slate-800 text-xs">{v.model_name}</div>
                        <div className="text-[10px] text-slate-400">{v.vehicle_type.toUpperCase()} • {v.registration_no || 'Reg Pending'}</div>
                      </div>
                      <span className="text-xs font-bold text-blue-600">Shift Ride →</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Modal: Official English Printable Invoice (with Generic Name, Booking Date & Disclaimers) */}
          {showInvoiceModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-8 border border-slate-200 my-8">
                <div id="printable-invoice" className="text-slate-800 text-xs">
                  {/* Bill Header */}
                  <div className="border-b-2 border-slate-800 pb-4 mb-4 flex justify-between items-start">
                    <div>
                      <h1 className="text-2xl font-black tracking-tight text-slate-900">KD CAPTAIN</h1>
                      <p className="text-xs text-slate-500 font-bold">Two-Wheeler Rental Service | Durga Puja 2026 Fleet</p>
                      <p className="text-xs text-slate-500 font-bold">Kolkata / Delhi</p>
                    </div>
                    <div className="text-right">
                      <div className="text-lg font-black text-slate-800">OFFICIAL RENTAL RECEIPT</div>
                      <div className="text-xs text-slate-700 font-black mt-1">
                        Booking Date: {bookingMetaMap[showInvoiceModal.booking.id]?.booking_date || (showInvoiceModal.booking.created_at ? showInvoiceModal.booking.created_at.split('T')[0] : '2026-10-08')}
                      </div>
                      <div className="text-[10px] text-slate-400 font-semibold">Print Date: {new Date().toLocaleDateString()}</div>
                    </div>
                  </div>

                  {/* Customer & Vehicle Details (Generic Name Used) */}
                  <div className="grid grid-cols-2 gap-4 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                      <div className="text-[10px] uppercase font-black text-slate-400 tracking-wider">Customer Details</div>
                      <div className="font-black text-slate-900 text-sm mt-1">{showInvoiceModal.booking.customer_name}</div>
                      <div className="font-bold">Phone: {showInvoiceModal.booking.customer_phone}</div>
                      <div className="font-bold">WhatsApp: {showInvoiceModal.booking.customer_whatsapp}</div>
                    </div>
                    <div>
                      <div className="text-[10px] uppercase font-black text-slate-400 tracking-wider">Vehicle Assigned</div>
                      <div className="font-black text-blue-700 text-sm mt-1">
                        {getGenericCategoryName(showInvoiceModal.vehicle)}
                      </div>
                      <div className="font-bold text-slate-500 text-[11px] mt-0.5">Fleet Category: {showInvoiceModal.vehicle.vehicle_type.toUpperCase()}</div>
                    </div>
                  </div>

                  {/* Financial Breakdown Table */}
                  <table className="w-full mb-4 border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 text-[10px] uppercase font-black">
                        <th className="py-2 text-left">Description</th>
                        <th className="py-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-bold">
                      <tr>
                        <td className="py-2.5">Rental Duration: {showInvoiceModal.booking.start_date} to {showInvoiceModal.booking.end_date}</td>
                        <td className="py-2.5 text-right font-black">₹{showInvoiceModal.booking.total_rent}</td>
                      </tr>
                      <tr>
                        <td className="py-2.5 text-slate-500">Advance Received (Collected)</td>
                        <td className="py-2.5 text-right text-emerald-600 font-black">- ₹{showInvoiceModal.booking.advance_paid || 0}</td>
                      </tr>
                      <tr>
                        <td className="py-2.5 text-slate-500">Refundable Security Deposit</td>
                        <td className="py-2.5 text-right text-amber-700 font-black">₹{showInvoiceModal.booking.security_deposit || 1000}</td>
                      </tr>
                      <tr className="font-black text-slate-900 border-t border-slate-300 text-sm">
                        <td className="py-2.5">Remaining Balance to Pay (Due at Handover)</td>
                        <td className="py-2.5 text-right text-rose-600">₹{Math.max(0, (showInvoiceModal.booking.total_rent || 0) - (showInvoiceModal.booking.advance_paid || 0))}</td>
                      </tr>
                    </tbody>
                  </table>

                  {/* Mandatory Terms & Conditions (100% English Disclaimers) */}
                  <div className="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2 text-[11px] text-slate-600 leading-relaxed mb-6 font-medium">
                    <div className="font-black text-slate-900 text-xs mb-1">TERMS & CONDITIONS:</div>
                    <div>1. <strong>Security Deposit:</strong> A mandatory refundable security deposit of ₹{showInvoiceModal.booking.security_deposit || 1000} must be submitted upon delivery. The amount is 100% refundable upon vehicle return without any accidental or mechanical damage, or can be mutually adjusted with the final rental charge.</div>
                    <div>2. <strong>Original Identity Proof:</strong> The hirer MUST bring and deposit ONE Original Government Identity Proof (Aadhaar Card / Voter ID / Driving License) at the time of pickup. The document will remain safely deposited with management until vehicle return.</div>
                    <div>3. <strong>Payment Settlement:</strong> The remaining due balance must be fully cleared before the keys are handed over on the pickup date.</div>
                    <div>4. <strong>Safe Operation & Liability:</strong> The hirer is fully liable for any traffic violations, fines, challans, or accidental damage incurred during the rental tenure.</div>
                  </div>

                  {/* Signatures */}
                  <div className="flex justify-between items-end pt-4 border-t border-slate-200 text-xs font-bold">
                    <div>
                      <p className="text-slate-400">Authorized Signature</p>
                      <p className="font-black mt-4">KD Captain Management</p>
                    </div>
                    <div>
                      <p className="text-slate-400">Customer Signature</p>
                      <p className="font-black mt-4">_______________________</p>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-200 no-print">
                  <button onClick={() => setShowInvoiceModal(null)} className="px-5 py-2.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-600">Close</button>
                  <button onClick={() => window.print()} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-black shadow-md hover:bg-blue-700 flex items-center gap-2">
                    <i className="fa-solid fa-print"></i> Print / Save as PDF
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
